name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Preparar projeto
        run: |
          unzip -q EntregaClara-Android.zip -d fonte
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar calculos
        working-directory: fonte/EntregaClara
        run: java checks/Verify.java

      - name: Compilar APK de teste
        working-directory: fonte/EntregaClara
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EntregaClara-APK
          path: fonte/EntregaClara/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
